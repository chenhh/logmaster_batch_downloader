[package]
name = "logmaster_batch_downloader"
version = "0.1.0"
edition = "2021"

[features]
default = ["gui"]
cli = ["dep:clap"]
gui = ["dep:slint", "dep:rfd", "dep:dirs", "dep:slint-build"]

[dependencies]
reqwest = { version = "0.12.8", features = ["cookies"] }
scraper = "0.20.0"
tokio = { version = "1.40.0", features = ["full"] }
chrono = "0.4.38"
thiserror = "1.0"
clap = { version = "4.5.19", features = ["derive"], optional = true }
slint = { version = "1.8", optional = true }
rfd = { version = "0.15", optional = true }
dirs = { version = "5.0", optional = true }

[build-dependencies]
slint-build = { version = "1.8", optional = true }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3.12"
